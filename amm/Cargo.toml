[package]
name = "amm"
version = "0.1.0"
edition = "2021"

[features]
# Target the ntbundle devnet deployment instead of mainnet.
devnet = []

[dependencies]
jupiter-amm-interface = "0.4.5"
solana-sdk = "2.0.10"
anyhow = "1.0.89"
thiserror = "1.0.65"
rust_decimal = "1.36.0"

[dev-dependencies]
tokio = { version = "^1", features = ["full"] }
solana-program-test = "2.0.13"
serde_json = "1.0.128"
base64 = "0.22.1"
ahash = "0.8"
bincode = "1.3.3"
spl-token = { version = "6.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "5.0.1", features = ["no-entrypoint"] }
